; Réglages PHP de production du SAIE-CEEAC (complète php.ini-production).
; Téléversements : 500 Mo par vidéo (DOC-02) + marge ; les conversions longues passent par les files, pas par la requête.
upload_max_filesize = 520M
post_max_size = 525M
memory_limit = 512M
max_execution_time = 180
expose_php = Off
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1
