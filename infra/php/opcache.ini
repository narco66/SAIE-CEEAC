; OPcache de production : le code est figé dans l'image, aucune revalidation des fichiers à chaque requête.
; Un déploiement = une nouvelle image, donc un cache neuf (TECH-03).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
