; Groupe de processus PHP-FPM. Dimensionné d'après la recette R15 : 8 processus ont servi 100 lecteurs sans erreur
; (p95 199 ms) et une reprise simultanée en 2,5 s ; 16 laissent la marge nécessaire aux utilisateurs de l'administration.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 190s
clear_env = no
