# Frontend, lecteur et API sous un même domaine (API-05). En production, ajouter le certificat TLS (SEC-01)
# et restreindre l'administration au réseau institutionnel ou au VPN selon la décision de la DSI.
server {
    listen 80;
    server_name _;
    client_max_body_size 520m;            # 500 Mo par vidéo (DOC-02) + marge
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        try_files $uri /index.php?$query_string;
    }
    location /sanctum/ {
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 180s;
    }

    location /player/ {
        alias /usr/share/nginx/html/player/;
        try_files $uri $uri/ /player/index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:7071; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html/app;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
    }
}
