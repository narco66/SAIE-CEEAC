# Frontend, lecteur et API sous un même domaine (API-05), en HTTPS uniquement (SEC-01).
# Certificat et clé fournis par la DSI, montés en lecture seule dans /etc/nginx/certs (fullchain.pem, privkey.pem).
# Restreindre l'administration au réseau institutionnel ou au VPN selon la décision de la DSI (SEC-06).

# HTTP : seulement la validation ACME et le contrôle de santé du conteneur ; tout le reste est redirigé vers HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 520m;            # 500 Mo par vidéo (DOC-02) + marge

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SAIE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.php?$query_string;
    }
    location /sanctum/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 180s;
        # SEC-01 : HSTS et en-têtes communs aussi sur les réponses de l'API (Nginx n'hérite pas des add_header du serveur).
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Médias des lecteurs (PERF-01) : l'API autorise chaque téléchargement puis délègue l'envoi à Nginx (X-Accel-Redirect),
    # sans occuper un processus PHP pendant le transfert. Emplacement interne, inaccessible directement.
    location /protected-storage/ {
        internal;
        alias /srv/saie-storage/app/private/;
        add_header Cache-Control "private, max-age=86400, immutable" always;
    }

    # Versions du lecteur publiées par canal (PLY-12) : volume alimenté par la procédure de publication.
    location /player/releases/ {
        alias /srv/player-releases/;
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:7071; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location /player/assets/ {
        alias /usr/share/nginx/html/player/assets/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /player/ {
        alias /usr/share/nginx/html/player/;
        try_files $uri $uri/ /player/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:7071; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        root /usr/share/nginx/html/app;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        root /usr/share/nginx/html/app;
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
}
