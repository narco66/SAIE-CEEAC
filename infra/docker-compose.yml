# Pile de production SAIE-CEEAC : PostgreSQL 18, Redis, ClamAV, API Laravel (PHP-FPM), workers, planificateur, Nginx en HTTPS.
# Procédure complète : docs/exploitation/mise-en-service.md. Aucun secret n'est versionné :
#   infra/.env                       configuration (modèle : infra/.env.example)
#   infra/secrets/manifest-ed25519.pem   clé de signature des manifestes (propriétaire uid 33, droits 600)
#   infra/certs/fullchain.pem, privkey.pem   certificat TLS fourni par la DSI
# Déploiement :
#   docker compose -f infra/docker-compose.yml build
#   docker compose -f infra/docker-compose.yml --profile deploy run --rm migrate
#   docker compose -f infra/docker-compose.yml --profile deploy run --rm preflight      (doit se terminer sans contrôle bloquant)
#   docker compose -f infra/docker-compose.yml up -d
# Essai local avec Mailpit : ajouter --profile local et MAIL_HOST=mailpit, MAIL_PORT=1025 dans infra/.env.
name: saie-ceeac

x-app: &app
  image: saie-ceeac/php:${SAIE_VERSION:-latest}
  build: { context: .., dockerfile: infra/php.Dockerfile }
  env_file: [.env]
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    SAIE_AV_DRIVER: clamd
    SAIE_CLAMD_HOST: clamav
    SAIE_CLAMD_PORT: 3310
    SAIE_MANIFEST_KEY_PATH: /run/secrets/saie/manifest-ed25519.pem
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
  volumes:
    - storage:/var/www/html/storage
    - ./secrets:/run/secrets/saie:ro
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    clamav: { condition: service_started }

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: saie_ceeac
      POSTGRES_USER: saie
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans infra/.env}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U saie -d saie_ceeac"], interval: 5s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    volumes: [clamdb:/var/lib/clamav]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    ports: ["8025:8025"]

  api:
    <<: *app
    command: ["php-fpm"]
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=default,notifications,media,exports", "--tries=3", "--max-time=3600"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  # Tâches ponctuelles de déploiement (profil « deploy ») : sauvegarde préalable obligatoire avant migrate (TECH-04).
  migrate:
    <<: *app
    profiles: [deploy]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
  preflight:
    <<: *app
    profiles: [deploy]
    restart: "no"
    command: ["php", "artisan", "saie:preflight"]

  web:
    image: saie-ceeac/web:${SAIE_VERSION:-latest}
    build: { context: .., dockerfile: infra/web.Dockerfile }
    ports: ["80:80", "443:443"]
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - player-releases:/srv/player-releases:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  clamdb: {}
  storage: {}
  player-releases: {}
